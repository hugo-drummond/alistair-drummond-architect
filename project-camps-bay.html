  <title>The Drive, Camps Bay — Alistair Drummond Architect</title>

<body>
  <header class="header">
    <div class="nav-row">
      <button class="burger" id="burger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-items" id="navItems">
        <a href="index.html">Home</a>
        <a href="projects.html">Projects</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
      </div>
    </div>
    <a href="index.html" class="header-brand">Alistair Drummond Architect</a>
  </header>

  <main class="page">
    <div class="project-title-wrap">
      <h1 class="project-title">The Drive, Camps Bay</h1>
    </div>

    <section class="images-section">
      <div class="images-label">Featured Images</div>
      <div class="gallery">
        <button class="gallery-arrow gallery-prev" aria-label="Previous">&#8249;</button>
        <div class="gallery-pair">
          <img class="gallery-img" id="img-a" src="" alt="" />
          <img class="gallery-img" id="img-b" src="" alt="" />
        </div>
        <button class="gallery-arrow gallery-next" aria-label="Next">&#8250;</button>
      </div>
      <div class="gallery-counter" id="galleryCounter"></div>
      <button class="gallery-close" id="galleryClose">&#215;</button>
    </section>
  </main>

  <script>
    const burger = document.getElementById('burger');
    const navItems = document.getElementById('navItems');
    burger.addEventListener('click', () => {
      burger.classList.toggle('open');
      navItems.classList.toggle('open');
    });

    const desktopSlides = [
      ['images/camps-bay/Alistair-Drummond-Architect_HumphreysDavies1.jpg', 'images/camps-bay/Alistair-Drummond-Architect_HumphreysDavies3.jpg'],
      ['images/camps-bay/slide-2.jpg'],
      ['images/camps-bay/Alistair-Drummond-Architect_HumphreysDaviesCampsBay1.jpg', 'images/camps-bay/Alistair-Drummond-Architect_HumphreysDaviesCampsBay2.jpg'],
      ['images/camps-bay/AlistairDrummondArchitect_TheDriveCampsBay19.jpg', 'images/camps-bay/DSC_0737-scaled.jpg'],
    ];
    const mobileSlides = [
      ['images/camps-bay/mob-cb-1.jpg'],
      ['images/camps-bay/mob-cb-2.jpg'],
      ['images/camps-bay/mob-cb-3.jpg'],
      ['images/camps-bay/mob-cb-4.jpg'],
    ];
    const slides = window.innerWidth <= 768 ? mobileSlides : desktopSlides;

    const imgA = document.getElementById('img-a');
    const imgB = document.getElementById('img-b');
    const galleryPair = document.querySelector('.gallery-pair');
    const counter = document.getElementById('galleryCounter');
    let current = 0;

    function showSlide(index) {
      current = (index + slides.length) % slides.length;
      const slide = slides[current];
      imgA.src = slide[0];
      if (slide[1]) {
        imgB.src = slide[1];
        imgB.style.display = 'block';
        galleryPair.style.gridTemplateColumns = '1fr 1fr';
        section.classList.remove('solo');
      } else {
        imgB.src = '';
        imgB.style.display = 'none';
        galleryPair.style.gridTemplateColumns = '1fr';
        section.classList.add('solo');
      }
      counter.textContent = (current + 1) + ' / ' + slides.length;
      if (section.classList.contains('focused')) { applyOrientation(); equalizeHeights(); }
    }

    const section = document.querySelector('.images-section');
    const closeBtn = document.getElementById('galleryClose');

    let preFocusRect = null;
    function applyOrientation() { const aLoaded = imgA.complete && imgA.naturalWidth > 0; const aPortrait = aLoaded && imgA.naturalHeight > imgA.naturalWidth; if (!aLoaded) imgA.onload = applyOrientation; section.classList.toggle("portrait-slide", aPortrait); const hasPair = imgB && imgB.style.display !== "none"; const bLoaded = hasPair && imgB.complete && imgB.naturalWidth > 0; const bPortrait = bLoaded && imgB.naturalHeight > imgB.naturalWidth; if (hasPair && !bLoaded) imgB.onload = applyOrientation; section.classList.toggle("portrait-pair", aPortrait && bPortrait); }

    function equalizeHeights() {
      if (!section.classList.contains('focused')) return;
      if (section.classList.contains('solo')) return;
      if (!imgB || imgB.style.display === 'none') return;
      function compute() {
        if (!imgA.naturalWidth || !imgB.naturalWidth) return;
        const availW = galleryPair.offsetWidth - 8;
        const arA = imgA.naturalWidth / imgA.naturalHeight;
        const arB = imgB.naturalWidth / imgB.naturalHeight;
        const maxH = Math.min(window.innerHeight - 160, 580);
        const h = Math.min(availW / (arA + arB), maxH);
        [imgA, imgB].forEach(img => {
          img.style.setProperty('height', h + 'px', 'important');
          img.style.setProperty('width', 'auto', 'important');
          img.style.setProperty('max-height', 'none', 'important');
          img.style.setProperty('flex', '0 0 auto', 'important');
        });
      }
      if (imgA.complete && imgA.naturalWidth && imgB.complete && imgB.naturalWidth) { compute(); }
      else { imgA.onload = imgB.onload = () => { if (imgA.naturalWidth && imgB.naturalWidth) compute(); }; }
    }
    function clearHeights() {
      [imgA, imgB].forEach(img => {
        img.style.removeProperty('height'); img.style.removeProperty('width');
        img.style.removeProperty('max-height'); img.style.removeProperty('flex');
      });
    }
    function enterFocusAfterOrient() {
      preFocusRect = section.getBoundingClientRect();
      const doFocus = () => {
        applyOrientation();
        const vw = window.innerWidth, vh = window.innerHeight, r = preFocusRect;
        section.classList.add("focused"); document.body.classList.add("gallery-focus");
        section.style.transition = 'none';
        section.style.clipPath = `inset(${r.top}px ${vw - r.right}px ${vh - r.bottom}px ${r.left}px)`;
        section.offsetHeight;
        section.style.transition = 'clip-path 0.4s cubic-bezier(0.4,0,0.2,1)';
        section.style.clipPath = 'inset(0px 0px 0px 0px)';
        setTimeout(equalizeHeights, 420);
      };
      if (imgA.complete && imgA.naturalWidth > 0) { setTimeout(doFocus, 250); }
      else { imgA.onload = () => setTimeout(doFocus, 250); }
    }
    function exitFocus() {
      clearHeights();
      if (!preFocusRect) { section.classList.remove('focused'); document.body.classList.remove('gallery-focus'); return; }
      const vw = window.innerWidth, vh = window.innerHeight, r = preFocusRect;
      section.style.transition = 'clip-path 0.4s cubic-bezier(0.4,0,0.2,1)';
      section.style.clipPath = `inset(${r.top}px ${vw - r.right}px ${vh - r.bottom}px ${r.left}px)`;
      setTimeout(() => {
        section.classList.remove('focused'); document.body.classList.remove('gallery-focus');
        section.style.clipPath = ''; section.style.transition = ''; preFocusRect = null;
      }, 400);
    }

    document.querySelector('.gallery-prev').addEventListener('click', () => { showSlide(current - 1); enterFocusAfterOrient(); });
    document.querySelector('.gallery-next').addEventListener('click', () => { showSlide(current + 1); enterFocusAfterOrient(); });
    closeBtn.addEventListener('click', exitFocus);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') exitFocus(); });

    if (window.innerWidth > 768) showSlide(0);
    if (window.innerWidth <= 768) {
      var scroll = document.createElement('div');
      scroll.className = 'mobile-scroll';
      mobileSlides.forEach(function(s) {
        var img = document.createElement('img');
        img.src = s[0]; img.alt = ''; img.loading = 'lazy';
        scroll.appendChild(img);
      });
      document.querySelector('.page').appendChild(scroll);
    }
  </script>
</body>
