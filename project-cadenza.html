<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadenza, Fernwood — Alistair Drummond Architect</title>
  <link rel="stylesheet" href="project.css" />
  <style>
    /* Paired portrait slides */
    .images-section.focused.portrait-slide:not(.solo):not(.triple) .gallery-pair {
      grid-template-columns: auto auto !important;
      justify-content: center;
      gap: 20px;
    }
    .images-section.focused.portrait-slide:not(.solo):not(.triple) .gallery-img {
      width: auto !important;
      height: calc(100vh - 120px) !important;
      max-height: calc(100vh - 120px) !important;
      object-fit: contain !important;
    }
    /* Triple portrait slides */
    .images-section.focused.portrait-slide.triple .gallery-pair {
      grid-template-columns: auto auto auto !important;
      justify-content: center;
      gap: 12px;
    }
    .images-section.focused.portrait-slide.triple .gallery-img {
      width: auto !important;
      height: calc(100vh - 120px) !important;
      max-height: calc(100vh - 120px) !important;
      object-fit: contain !important;
    }
    /* Solo portrait slides */
    .images-section.focused.portrait-slide.solo .gallery {
      display: flex;
      justify-content: center;
    }
    .images-section.focused.portrait-slide.solo .gallery-img {
      width: auto !important;
      height: calc(100vh - 120px) !important;
      max-height: calc(100vh - 120px) !important;
      object-fit: contain !important;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="nav-row">
      <button class="burger" id="burger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-items" id="navItems">
        <a href="index.html">Home</a>
        <a href="projects.html">Projects</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
      </div>
    </div>
    <a href="index.html" class="header-brand">Alistair Drummond Architect</a>
  </header>
  <main class="page">
    <div class="project-title-wrap">
      <h1 class="project-title">Cadenza, Fernwood</h1>
    </div>
    <section class="images-section">
      <div class="images-label">Featured Images</div>
      <div class="gallery">
        <button class="gallery-arrow gallery-prev" aria-label="Previous">&#8249;</button>
        <div class="gallery-pair">
          <img class="gallery-img" id="img-a" src="" alt="" />
          <img class="gallery-img" id="img-b" src="" alt="" />
          <img class="gallery-img" id="img-c" src="" alt="" />
        </div>
        <button class="gallery-arrow gallery-next" aria-label="Next">&#8250;</button>
      </div>
      <div class="gallery-counter" id="galleryCounter"></div>
      <button class="gallery-close" id="galleryClose">&#215;</button>
    </section>
  </main>
  <script>
    const burger = document.getElementById('burger');
    const navItems = document.getElementById('navItems');
    burger.addEventListener('click', () => { burger.classList.toggle('open'); navItems.classList.toggle('open'); });
    const slides = [
      ['images/cadenza/Alistair-Drummond-Architect_DukFernwood10.jpg', 'images/cadenza/Alistair-Drummond-Architect_CadenzaFernwoord5.jpg'],
      ['images/cadenza/Alistair-Drummond-Architect_CadenzaFernwoord2.jpg'],
      ['images/cadenza/Alistair-Drummond-Architect_CadenzaFernwoord3.jpg'],
      ['images/cadenza/Alistair-Drummond-Architect_CadenzaFernwoord7.jpg', 'images/cadenza/Alistair-Drummond-Architect_CadenzaFernwoord8.jpg'],
      ['images/cadenza/Alistair-Drummond-Architect_CadenzaFernwoord9.jpg', 'images/cadenza/Alistair-Drummond-Architect_CadenzaFernwoord10.jpg'],
      ['images/cadenza/Alistair-Drummond-Architect_CadenzaFernwoord11.jpg', 'images/cadenza/Alistair-Drummond-Architect_CadenzaFernwoord12.jpg'],
      ['images/cadenza/4.jpg', 'images/cadenza/3.jpg'],
      ['images/cadenza/Alistair-Drummond-Architect_CadenzaFernwoord14.jpg'],
      ['images/cadenza/Alistair-Drummond-Architect_DukFernwood2.jpg', 'images/cadenza/Alistair-Drummond-Architect_DukFernwood4.jpg', 'images/cadenza/Alistair-Drummond-Architect_DukFernwood9.jpg'],
      ['images/cadenza/Alistair-Drummond-Architect_DukFernwood6.jpg', 'images/cadenza/Alistair-Drummond-Architect_DukFernwood8.jpg'],
      ['images/cadenza/Alistair-Drummond-Architect_DukFernwood11.jpg', 'images/cadenza/Newlands.jpg']
    ];
    const imgA = document.getElementById('img-a');
    const imgB = document.getElementById('img-b');
    const imgC = document.getElementById('img-c');
    const galleryPair = document.querySelector('.gallery-pair');
    const counter = document.getElementById('galleryCounter');
    let current = 0;
    function showSlide(index) {
      current = (index + slides.length) % slides.length;
      const slide = slides[current];
      imgA.src = slide[0];
      if (slide[2]) {
        imgB.src = slide[1]; imgB.style.display = 'block';
        imgC.src = slide[2]; imgC.style.display = 'block';
        galleryPair.style.gridTemplateColumns = '1fr 1fr 1fr';
        section.classList.remove('solo'); section.classList.add('triple');
      } else if (slide[1]) {
        imgB.src = slide[1]; imgB.style.display = 'block';
        imgC.src = ''; imgC.style.display = 'none';
        galleryPair.style.gridTemplateColumns = '1fr 1fr';
        section.classList.remove('solo'); section.classList.remove('triple');
      } else {
        imgB.src = ''; imgB.style.display = 'none';
        imgC.src = ''; imgC.style.display = 'none';
        galleryPair.style.gridTemplateColumns = '1fr';
        section.classList.add('solo'); section.classList.remove('triple');
      }
      counter.textContent = (current + 1) + ' / ' + slides.length;
      if (section.classList.contains('focused')) applyOrientation();
    }
    const section = document.querySelector('.images-section');
    const closeBtn = document.getElementById('galleryClose');
    function applyOrientation() { if (imgA.complete && imgA.naturalWidth > 0) { section.classList.toggle("portrait-slide", imgA.naturalHeight > imgA.naturalWidth); } else { imgA.onload = () => section.classList.toggle("portrait-slide", imgA.naturalHeight > imgA.naturalWidth); } } function enterFocusAfterOrient() {
      const scrollDuration = 3000;
      const scrollStart = window.pageYOffset;
      const scrollTarget = section.getBoundingClientRect().top + scrollStart;
      const scrollBegin = performance.now();
      (function animateScroll(now) {
        const elapsed = now - scrollBegin;
        const p = Math.min(elapsed / scrollDuration, 1);
        const ease = p < 0.5 ? 2*p*p : -1+(4-2*p)*p;
        window.scrollTo(0, scrollStart + (scrollTarget - scrollStart) * ease);
        if (p < 1) requestAnimationFrame(animateScroll);
      })(performance.now());
      const doFocus = () => { applyOrientation(); section.classList.add("focused"); document.body.classList.add("gallery-focus"); };
      if (imgA.complete && imgA.naturalWidth > 0) { setTimeout(doFocus, 2800); }
      else { imgA.onload = () => setTimeout(doFocus, 2800); }
    }
    function exitFocus() { section.classList.remove('focused'); document.body.classList.remove('gallery-focus'); }
    document.querySelector('.gallery-prev').addEventListener('click', () => { showSlide(current - 1); enterFocusAfterOrient(); });
    document.querySelector('.gallery-next').addEventListener('click', () => { showSlide(current + 1); enterFocusAfterOrient(); });
    closeBtn.addEventListener('click', exitFocus);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') exitFocus(); });
    showSlide(0);
  </script>
</body>
</html>
