  <title>Upper Kloof Street — Alistair Drummond Architect</title>
  <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32" />

<body>
  <header class="header">
    <div class="nav-row">
      <button class="burger" id="burger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-items" id="navItems">
        <a href="index.html">Home</a>
        <a href="projects.html">Projects</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
      </div>
    </div>
    <a href="index.html" class="header-brand">Alistair Drummond Architect</a>
  </header>
  <main class="page">
    <div class="project-title-wrap">
      <h1 class="project-title">Upper Kloof Street</h1>
    </div>
    <section class="images-section">
      <div class="images-label">Featured Images</div>
      <div class="gallery">
        <button class="gallery-arrow gallery-prev" aria-label="Previous">&#8249;</button>
        <div class="gallery-pair">
          <img class="gallery-img" id="img-a" src="" alt="" />
          <img class="gallery-img" id="img-b" src="" alt="" />
        </div>
        <button class="gallery-arrow gallery-next" aria-label="Next">&#8250;</button>
      </div>
      <div class="gallery-counter" id="galleryCounter"></div>
      <button class="gallery-close" id="galleryClose">&#215;</button>
    </section>
  </main>
  <script>
    const burger = document.getElementById('burger');
    const navItems = document.getElementById('navItems');
    burger.addEventListener('click', () => { burger.classList.toggle('open'); navItems.classList.toggle('open'); });

    const desktopSlides = [
      ['images/upper-kloof/Alistair-Drummond-Architect_UpperKoof6.jpg', 'images/upper-kloof/20120311_DrummondHouse_4976-scaled.jpg'],
      // Composite — solo (side-by-side courtyard + pool)
      ['images/upper-kloof/Alistair-Drummond-Architect_UpperKloof8.jpg'],
      // Composite — solo (top/bottom exterior)
      ['images/upper-kloof/Alistair-Drummond-Architect_UpperKloof9.jpg'],
      // Interior living/stair singles
      ['images/upper-kloof/Alistair-Drummond-Architect_28bUpperKloofStreet3.jpg', 'images/upper-kloof/Alistair-Drummond-Architect_UpperKloof10.jpg'],
      // Composite — solo (staircase side-by-side)
      ['images/upper-kloof/Alistair-Drummond-Architect_UpperKoof3.jpg', 'images/upper-kloof/Alistair-Drummond-Architect_UpperKoof5.jpg'],
      // Stair detail + kitchen paired
      ['images/upper-kloof/Alistair-Drummond-Architect_28bUpperKloofStreet9.jpg', 'images/upper-kloof/Alistair-Drummond-Architect_28bUpperKloofStreet2.jpg'],
      // Bedroom singles paired
      ['images/upper-kloof/Alistair-Drummond-Architect_28bUpperKloofStreet4.jpg', 'images/upper-kloof/Alistair-Drummond-Architect_28bUpperKloofStreet5.jpg'],
      // Library/shelving + bedroom with joinery
      ['images/upper-kloof/Alistair-Drummond-Architect_UpperKloof12.jpg', 'images/upper-kloof/Alistair-Drummond-Architect_UpperKloof13.jpg'],
      // Concrete feature wall + overhead view
      ['images/upper-kloof/Alistair-Drummond-Architect_UpperKloof16.jpg'],
      // Remaining singles paired
    ];
    const mobileSlides = [
      ['images/upper-kloof/mob-uk-1.jpg'],
      ['images/upper-kloof/mob-uk-2.jpg'],
      ['images/upper-kloof/mob-uk-3.jpg'],
      ['images/upper-kloof/mob-uk-4.jpg'],
      ['images/upper-kloof/mob-uk-5.jpg'],
      ['images/upper-kloof/mob-uk-6.jpg'],
    ];
    const slides = window.innerWidth <= 768 ? mobileSlides : desktopSlides;

    const imgA = document.getElementById('img-a');
    const imgB = document.getElementById('img-b');
    const galleryPair = document.querySelector('.gallery-pair');
    const counter = document.getElementById('galleryCounter');
    let current = 0;

    function showSlide(index) {
      current = (index + slides.length) % slides.length;
      const slide = slides[current];
      imgA.src = slide[0];
      if (slide[1]) {
        imgB.src = slide[1];
        imgB.style.display = 'block';
        galleryPair.style.gridTemplateColumns = '1fr 1fr';
        section.classList.remove('solo');
      } else {
        imgB.src = '';
        imgB.style.display = 'none';
        galleryPair.style.gridTemplateColumns = '1fr';
        section.classList.add('solo');
      }
      counter.textContent = (current + 1) + ' / ' + slides.length;
      if (section.classList.contains('focused')) applyOrientation();
    }

    const section = document.querySelector('.images-section');
    const closeBtn = document.getElementById('galleryClose');

    function applyOrientation() { if (imgA.complete && imgA.naturalWidth > 0) { section.classList.toggle("portrait-slide", imgA.naturalHeight > imgA.naturalWidth); } else { imgA.onload = () => section.classList.toggle("portrait-slide", imgA.naturalHeight > imgA.naturalWidth); } } function enterFocusAfterOrient() {
      const doFocus = () => { applyOrientation(); section.classList.add("focused"); document.body.classList.add("gallery-focus"); };
      if (imgA.complete && imgA.naturalWidth > 0) { setTimeout(doFocus, 250); }
      else { imgA.onload = () => setTimeout(doFocus, 250); }
    }
    function exitFocus() { section.classList.remove('focused'); document.body.classList.remove('gallery-focus'); }

    document.querySelector('.gallery-prev').addEventListener('click', () => { showSlide(current - 1); enterFocusAfterOrient(); });
    document.querySelector('.gallery-next').addEventListener('click', () => { showSlide(current + 1); enterFocusAfterOrient(); });
    closeBtn.addEventListener('click', exitFocus);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') exitFocus(); });

    showSlide(0);

    if (window.innerWidth <= 768) {
      var scroll = document.createElement('div');
      scroll.className = 'mobile-scroll';
      mobileSlides.forEach(function(s) {
        var img = document.createElement('img');
        img.src = s[0]; img.alt = ''; img.loading = 'lazy';
        scroll.appendChild(img);
      });
      document.querySelector('.page').appendChild(scroll);
    }
  </script>
</body>
</html>
