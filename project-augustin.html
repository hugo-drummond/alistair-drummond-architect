<body>
  <header class="header">
    <div class="nav-row">
      <button class="burger" id="burger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-items" id="navItems">
        <a href="index.html">Home</a>
        <a href="projects.html">Projects</a>
        <a href="contact.html">Contact</a>
      </div>
    </div>
    <a href="index.html" class="header-brand">Alistair Drummond Architect</a>
  </header>

  <main class="page">
    <div class="project-title-wrap">
      <h1 class="project-title">Augustin, Tamboerskloof</h1>
    </div>

    <section class="images-section">
      <div class="images-label">Featured Images</div>
      <div class="gallery">
        <button class="gallery-arrow gallery-prev" aria-label="Previous">&#8249;</button>
        <div class="gallery-pair">
          <img class="gallery-img" id="img-a" src="" alt="" />
          <img class="gallery-img" id="img-b" src="" alt="" />
        </div>
        <button class="gallery-arrow gallery-next" aria-label="Next">&#8250;</button>
      </div>
      <div class="gallery-counter" id="galleryCounter"></div>
      <button class="gallery-close" id="galleryClose">&#215;</button>
    </section>
  </main>

  <script>
    const burger = document.getElementById('burger');
    const navItems = document.getElementById('navItems');
    burger.addEventListener('click', () => {
      burger.classList.toggle('open');
      navItems.classList.toggle('open');
    });

    const desktopSlides = [
      // Composites — solo slides
      ['images/augustin/Alistair-Drummond-Architect_StMichaels_Augustin1.jpg'],
      ['images/augustin/Image-1-for-ada-scaled.jpg'],
      ['images/augustin/Image-2-for-ada-scaled.jpg'],
      ['images/augustin/Image-3-for-ada-scaled.jpg'],
      ['images/augustin/Image-4-for-ada-scaled.jpg'],
      ['images/augustin/Image-5-for-ada-scaled.jpg'],
      ['images/augustin/Alistair-Drummond-Architect_StMichealsAugustin2.jpg'],
      // Singles — paired
      ['images/augustin/Alistair-Drummond-Architect_StMichealsAugustin1.jpg', 'images/augustin/St-Michaels_082.jpg'],
      ['images/augustin/Alistair-Drummond-Architect_StMichaels_Augustin2.jpg', 'images/augustin/Alistair-Drummond-Architect_StMichaels_Augustin3.jpg'],
      ['images/augustin/Alistair-Drummond-Architect_StMichaels_Augustin4.jpg', 'images/augustin/Alistair-Drummond-Architect_Augustin8.jpg'],
      ['images/augustin/Alistair-Drummond-Architect_StMichealsAugustin3.jpg', 'images/augustin/St-Michaels_096-e1704539762171.jpg'],
      ['images/augustin/Tamboes.jpg'],
    ];
    const mobileSlides = [
      ['images/augustin/mob-aug-1.jpg'],
      ['images/augustin/mob-aug-2.jpg'],
      ['images/augustin/mob-aug-3.jpg'],
      ['images/augustin/mob-aug-4.jpg'],
      ['images/augustin/mob-aug-5.jpg'],
      ['images/augustin/mob-aug-6.jpg'],
      ['images/augustin/mob-aug-7.jpg'],
    ];
    const slides = window.innerWidth <= 768 ? mobileSlides : desktopSlides;

    const imgA = document.getElementById('img-a');
    const imgB = document.getElementById('img-b');
    const galleryPair = document.querySelector('.gallery-pair');
    const counter = document.getElementById('galleryCounter');
    let current = 0;

    function showSlide(index) {
      current = (index + slides.length) % slides.length;
      const slide = slides[current];
      imgA.src = slide[0];
      if (slide[1]) {
        imgB.src = slide[1];
        imgB.style.display = 'block';
        galleryPair.style.gridTemplateColumns = '1fr 1fr';
      } else {
        imgB.src = '';
        imgB.style.display = 'none';
        galleryPair.style.gridTemplateColumns = '1fr';
      }
      counter.textContent = (current + 1) + ' / ' + slides.length;
    }

    const section = document.querySelector('.images-section');
    const closeBtn = document.getElementById('galleryClose');

    function enterFocus() {
      section.classList.add('focused');
      document.body.classList.add('gallery-focus');
    }
    function exitFocus() {
      section.classList.remove('focused');
      document.body.classList.remove('gallery-focus');
    }

    document.querySelector('.gallery-prev').addEventListener('click', () => { showSlide(current - 1); enterFocus(); });
    document.querySelector('.gallery-next').addEventListener('click', () => { showSlide(current + 1); enterFocus(); });
    closeBtn.addEventListener('click', exitFocus);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') exitFocus(); });

    showSlide(0);
    if (window.innerWidth <= 768) {
      var scroll = document.createElement('div');
      scroll.className = 'mobile-scroll';
      mobileSlides.forEach(function(s) {
        var img = document.createElement('img');
        img.src = s[0]; img.alt = '';
        scroll.appendChild(img);
      });
      document.querySelector('.page').appendChild(scroll);
    }
  </script>
</body>
</html>
