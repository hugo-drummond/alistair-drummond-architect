<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Alistair Drummond Architect" />
  <meta property="og:title" content="Contact — Alistair Drummond Architect" />
  <meta property="og:description" content="Contact Alistair Drummond Architect, based at 2b Van Reenen Street, Newlands, Cape Town. Enquire about new residential builds, extensions, or renovations." />
  <meta property="og:url" content="https://alistair-drummond-architect.vercel.app/contact.html" />
  <meta property="og:image" content="https://alistair-drummond-architect.vercel.app/images/project1.jpg" />
  <meta name="twitter:card" content="summary_large_image" />

  <meta name="twitter:image" content="https://alistair-drummond-architect.vercel.app/images/project1.jpg" />
  <link rel="preconnect" href="https://maps.googleapis.com" />
  <link rel="preconnect" href="https://maps.gstatic.com" crossorigin />
  <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
  <link rel="stylesheet" href="contact.css" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ContactPage",
    "name": "Contact — Alistair Drummond Architect",
    "url": "https://alistair-drummond-architect.vercel.app/contact.html",
    "description": "Get in touch with Alistair Drummond Architect, based in Newlands, Cape Town.",
    "mainEntity": { "@id": "https://alistair-drummond-architect.vercel.app/#business" },
    "breadcrumb": {
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://alistair-drummond-architect.vercel.app/" },
        { "@type": "ListItem", "position": 2, "name": "Contact", "item": "https://alistair-drummond-architect.vercel.app/contact.html" }
      ]
    }
  }
  </script>
</head>
<body>

  <!-- NAV -->
  <header class="header">
    <div class="nav-row">
      <button class="burger" id="burger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-items" id="navItems">
        <a href="index.html">Home</a>
        <a href="projects.html">Projects</a>
        <a href="gallery.html">Gallery</a>
      </div>
    </div>
    <a href="index.html" class="header-brand">Alistair Drummond Architect</a>
  </header>

  <main class="page">

    <!-- LEFT: FORM -->
    <div class="form-side">
      <h1 class="page-title">Contact</h1>

      <form class="form" action="#" method="post">

        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your full name" required />
        </div>

        <div class="field">
          <label for="phone">Number</label>
          <div class="phone-row">
            <select id="phone-code" name="phone-code" aria-label="Country code">
              <option value="+27" selected>🇿🇦 +27</option>
              <option value="+1">🇺🇸 +1</option>
              <option value="+44">🇬🇧 +44</option>
              <option value="+61">🇦🇺 +61</option>
              <option value="+49">🇩🇪 +49</option>
              <option value="+33">🇫🇷 +33</option>
              <option value="+31">🇳🇱 +31</option>
              <option value="+264">🇳🇦 +264</option>
              <option value="+263">🇿🇼 +263</option>
              <option value="+267">🇧🇼 +267</option>
            </select>
            <input type="tel" id="phone" name="phone" placeholder="Phone number" />
          </div>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="your@email.com" required />
        </div>

        <div class="field">
          <label for="message">Tell us about your project</label>
          <textarea id="message" name="message" rows="6" placeholder="Describe your project, timeline, or any questions…"></textarea>
        </div>

        <button type="submit" class="submit-btn">Send Message</button>

      </form>

      <div class="office-info">
        <p>2b Van Reenen Street</p>
        <p>Newlands, Cape Town</p>
      </div>
    </div>

    <!-- RIGHT: MAP -->
    <div class="map-side">
      <iframe
        class="map"
        src="https://www.google.com/maps?q=2b+Van+Reenen+Street,+Newlands,+Cape+Town,+South+Africa&output=embed&z=15"
        allowfullscreen
        referrerpolicy="no-referrer-when-downgrade"
        title="Office location">
      </iframe>
    </div>

  </main>

  <script>
    const burger = document.getElementById('burger');
    const navItems = document.getElementById('navItems');
    burger.addEventListener('click', () => {
      burger.classList.toggle('open');
      navItems.classList.toggle('open');
    });
  </script>
</body>
</html>
